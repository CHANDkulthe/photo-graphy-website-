<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Subhagsoni Kulthe Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0e0e0d;
      --ink2: #161615;
      --gold: #c9a96e;
      --gold-dim: rgba(201, 169, 110, 0.15);
      --cream: #f4f1ea;
      --mist: rgba(244, 241, 234, 0.6);
      --serif: 'Cormorant Garamond', serif;
      --sans: 'Inter', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--ink);
      color: var(--cream);
      font-family: var(--sans);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Custom Cursor ── */
    #cursor {
      width: 40px;
      height: 40px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.15s ease-out;
    }

    #cursor-dot {
      width: 4px;
      height: 4px;
      background: var(--gold);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Navigation ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 32px 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: linear-gradient(to bottom, var(--ink) 0%, transparent 100%);
      transition: background 0.4s, padding 0.4s;
    }

    nav.scrolled {
      background: rgba(14, 14, 13, 0.95);
      padding: 20px 80px;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 24px;
      letter-spacing: 0.1em;
      text-decoration: none;
      color: var(--cream);
      font-weight: 300;
    }

    .nav-logo em {
      color: var(--gold);
      font-style: italic;
    }

    .nav-links {
      display: flex;
      gap: 48px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--mist);
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    /* ── Contact Section ── */
    #contact-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 140px 80px 100px;
      position: relative;
    }

    .bg-accent {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vh;
      background: radial-gradient(circle at center, var(--gold-dim) 0%, transparent 70%);
      filter: blur(80px);
      z-index: -1;
      opacity: 0.3;
    }

    .contact-container {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 100px;
      max-width: 1200px;
      width: 100%;
      align-items: start;
    }

    .contact-info h1 {
      font-family: var(--serif);
      font-size: clamp(48px, 6vw, 84px);
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 40px;
    }

    .contact-info h1 em {
      color: var(--gold);
      font-style: italic;
    }

    .contact-info p {
      font-size: 18px;
      color: var(--mist);
      margin-bottom: 48px;
      max-width: 400px;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detail-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--gold);
    }

    .detail-value {
      font-family: var(--serif);
      font-size: 24px;
      color: var(--cream);
      text-decoration: none;
      transition: color 0.3s;
    }

    .detail-value:hover {
      color: var(--gold);
    }

    /* ── Form ── */
    .contact-form-wrap {
      background: rgba(22, 22, 21, 0.4);
      padding: 64px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      position: relative;
    }

    .contact-form-wrap::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 40px;
      height: 40px;
      border-top: 1px solid var(--gold);
      border-left: 1px solid var(--gold);
    }

    .form-group {
      margin-bottom: 32px;
    }

    .form-group label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--mist);
      margin-bottom: 12px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 0;
      color: var(--cream);
      font-family: var(--serif);
      font-size: 18px;
      outline: none;
      transition: border-color 0.4s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--gold);
    }

    .submit-btn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 16px 48px;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s;
      margin-top: 24px;
    }

    .submit-btn:hover {
      background: var(--gold);
      color: var(--ink);
    }

    /* ── Reveal Animation ── */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 1s cubic-bezier(0.2, 0, 0.2, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1024px) {
      nav { padding: 24px 40px; }
      #contact-page { padding: 140px 40px 80px; }
      .contact-container { grid-template-columns: 1fr; gap: 64px; }
      .contact-form-wrap { padding: 40px; }
    }
  </style>
</head>

<body>
  <div id="cursor"></div>
  <div id="cursor-dot"></div>

  <nav id="nav">
    <a href="index.html" class="nav-logo">Subhagsoni <em>Kulthe</em></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html" style="color: var(--gold)">Contact</a></li>
    </ul>
  </nav>

  <div class="bg-accent"></div>

  <section id="contact-page">
    <div class="contact-container">
      <div class="contact-info reveal">
        <p class="detail-label" style="margin-bottom: 12px;">Get in touch</p>
        <h1>Let's create something <em>eternal</em></h1>
        <p>Whether you're looking to document a journey, capture a portrait, or discuss a project, I'd love to hear from you.</p>
        
        <div class="contact-details">
          <div class="detail-item">
            <span class="detail-label">Email</span>
            <a href="mailto:hello@subhagsonikulthe.com" class="detail-value">hello@subhagsonikulthe.com</a>
          </div>
          <div class="detail-item">
            <span class="detail-label">Social</span>
            <div style="display: flex; gap: 24px; margin-top: 8px;">
              <a href="#" id="instagramLink" class="detail-value" style="font-size: 18px;">Instagram</a>
              <a href="#" class="detail-value" style="font-size: 18px;">Behance</a>
            </div>
          </div>
        </div>
      </div>

      <div class="contact-form-wrap reveal" style="transition-delay: 0.2s;">
        <form id="contactForm">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="contactName" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="contactEmail" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label>Subject</label>
            <input type="text" placeholder="Project inquiry, Print, etc.">
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea rows="4" placeholder="Share your thoughts..."></textarea>
          </div>
          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>
    </div>
  </section>

  <script>
    // Cursor
    const cursor = document.getElementById('cursor');
    const dot = document.getElementById('cursor-dot');
    let mx = 0, my = 0, cx = 0, cy = 0;

    window.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
      dot.style.left = mx + 'px';
      dot.style.top = my + 'px';
    });

    (function animCursor() {
      cx += (mx - cx) * 0.12;
      cy += (my - cy) * 0.12;
      cursor.style.left = cx + 'px';
      cursor.style.top = cy + 'px';
      requestAnimationFrame(animCursor);
    })();

    // Nav
    window.addEventListener('scroll', () => {
      document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 60);
    });

    // Reveal
    const revealEls = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    revealEls.forEach(el => observer.observe(el));

    // Form
    document.getElementById('contactForm').addEventListener('submit', e => {
      e.preventDefault();
      alert('Thank you! Your message has been sent to the void (simulated).');
    });

    // Hidden Admin Login via Instagram Link
    const instagramLink = document.getElementById('instagramLink');
    if (instagramLink) {
      instagramLink.addEventListener('click', e => {
        const nameVal = document.getElementById('contactName').value.trim();
        const emailVal = document.getElementById('contactEmail').value.trim();
        
        if (nameVal === 'Subhagsoni Kulthe' && emailVal === '7776077136') {
          e.preventDefault();
          window.location.href = 'admin.html';
        }
      });
    }
  </script>
  <!-- Anti-Scraping Protection -->
  <script>
    // CSS protection
    const style = document.createElement('style');
    style.innerHTML = `
      body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      img {
        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
        user-drag: none;
        pointer-events: none;
      }
      .gallery-item, .featured-frame { pointer-events: auto; }
    `;
    document.head.appendChild(style);

    // JS protection
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'c', 'u'].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'c'].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key === 'PrintScreen') {
        navigator.clipboard.writeText('');
        alert('Screenshots are disabled on this website.');
      }
    });

    // OS-level Screenshot Protection (Snipping Tool / Cmd+Shift+4)
    function obscureContent() {
      document.body.style.opacity = '0';
      document.body.style.filter = 'blur(50px)';
    }
    function revealContent() {
      document.body.style.opacity = '1';
      document.body.style.filter = 'none';
    }

    window.addEventListener('blur', obscureContent);
    window.addEventListener('focus', revealContent);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) obscureContent();
      else revealContent();
    });
  </script>
</body>

</html>
