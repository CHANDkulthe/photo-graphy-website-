<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subhagsoni Kulthe — Full Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@200;300;400&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ink: #0e0e0d;
      --ink2: #1a1a18;
      --mist: #8a8a80;
      --fog: #c2c2ba;
      --parchment: #f4f2ed;
      --cream: #faf9f6;
      --gold: #c9a96e;
      --gold-dim: rgba(201, 169, 110, 0.18);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Outfit', system-ui, sans-serif;
    }

    body {
      background: var(--ink);
      color: var(--cream);
      font-family: var(--sans);
      font-weight: 300;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── Custom cursor ── */
    #cursor {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(201, 169, 110, 0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width .25s, height .25s, border-color .25s, background .25s;
      mix-blend-mode: difference;
    }

    #cursor-dot {
      position: fixed;
      width: 5px;
      height: 5px;
      background: var(--gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform .1s;
    }

    body:has(a:hover) #cursor,
    body:has(button:hover) #cursor {
      width: 64px;
      height: 64px;
      background: var(--gold-dim);
      border-color: var(--gold);
    }

    /* ── Grain overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 100;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 36px 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      transition: padding .5s, background .5s, backdrop-filter .5s;
    }

    nav.scrolled {
      padding: 20px 80px;
      background: rgba(14, 14, 13, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 300;
      color: var(--cream);
      text-decoration: none;
      letter-spacing: 0.06em;
      position: relative;
    }

    .nav-logo em {
      color: var(--gold);
      font-style: normal;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mist);
      text-decoration: none;
      transition: color .3s;
      position: relative;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    /* ── Header ── */
    header {
      padding: 160px 80px 80px;
      text-align: center;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 300;
      color: var(--cream);
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }

    h1 em {
      color: var(--gold);
      font-style: italic;
    }

    .header-desc {
      font-size: 14px;
      color: var(--mist);
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── Gallery Grid ── */
    .gallery-container {
      padding: 0 80px 120px;
      max-width: 1600px;
      margin: 0 auto;
      column-count: 3;
      column-gap: 24px;
    }

    @media (max-width: 1024px) {
      .gallery-container {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      .gallery-container {
        column-count: 1;
        padding: 0 28px 80px;
      }
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      cursor: none;
    }

    /* CSS Art Placeholders */
    .photo-placeholder {
      width: 100%;
      position: relative;
      background: var(--ink2);
    }

    .photo-placeholder::after {
      content: '';
      display: block;
    }

    /* Different aspect ratios for masonry */
    .aspect-square::after {
      padding-bottom: 100%;
    }

    .aspect-portrait::after {
      padding-bottom: 133.33%;
    }

    .aspect-landscape::after {
      padding-bottom: 75%;
    }

    .aspect-tall::after {
      padding-bottom: 150%;
    }

    /* Gradients mimicking photos */
    .p1 {
      background: linear-gradient(160deg, #2a3520 0%, #4a6035 40%, #8aaa70 70%, #c4d4a0 100%);
    }

    .p2 {
      background: linear-gradient(180deg, #0a0d14 0%, #141d2a 30%, #1e3045 60%, #2a4a6a 80%, #3a6080 100%);
    }

    .p3 {
      background: linear-gradient(135deg, #101820 0%, #1a2530 50%, #243040 100%);
    }

    .p4 {
      background: linear-gradient(180deg, #1a1010 0%, #3a1a15 30%, #6a2a20 60%, #4a1a15 80%, #1a0d0a 100%);
    }

    .p5 {
      background: linear-gradient(160deg, #181210 0%, #2a1e18 40%, #3a2a22 70%, #1a1410 100%);
    }

    .p6 {
      background: linear-gradient(to bottom, #2b3036, #16181b);
    }

    .p7 {
      background: linear-gradient(135deg, #1a1510 0%, #2a2018 50%, #1a1510 100%);
    }

    .p8 {
      background: linear-gradient(to top right, #342a22, #181410);
    }

    .gallery-item img,
    .photo-placeholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85) saturate(0.8);
      transition: transform .9s cubic-bezier(.25, .46, .45, .94), filter .9s;
      display: block;
    }

    .gallery-item:hover img,
    .gallery-item:hover .photo-placeholder {
      filter: brightness(1.1) saturate(1.05);
    }

    .gallery-item-overlay {
      position: absolute;
      inset: 0;
      background: rgba(14, 14, 13, 0);
      display: flex;
      align-items: flex-end;
      padding: 24px;
      transition: background .5s;
    }

    .gallery-item:hover .gallery-item-overlay {
      background: rgba(14, 14, 13, 0.4);
    }

    .gallery-item-label {
      font-family: var(--serif);
      font-size: 16px;
      font-style: italic;
      color: rgba(250, 249, 246, 0);
      transition: color .5s, transform .5s;
      transform: translateY(10px);
      letter-spacing: 0.03em;
    }

    /* Hide specs from hover overlay - moved to modal */
    .gallery-item-specs {
      display: none;
    }

    /* ── Lightbox Modal ── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(14, 14, 13, 0.85);
      backdrop-filter: blur(20px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), 
                  visibility 1s cubic-bezier(0.4, 0, 0.2, 1), 
                  backdrop-filter 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #lightbox.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .lightbox-content {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 100px;
      width: 90%;
      max-width: 1400px;
      height: 85vh;
      align-items: center;
      margin: 0 auto;
      transform: scale(0.95) translateY(30px);
      filter: blur(15px);
      opacity: 0;
      transition: transform 1s cubic-bezier(0.2, 0, 0.2, 1), 
                  opacity 1s ease, 
                  filter 1.2s ease;
    }

    #lightbox.active .lightbox-content {
      transform: scale(1) translateY(0);
      filter: blur(0);
      opacity: 1;
    }

    .lightbox-details {
      color: var(--cream);
      opacity: 0;
      transform: translateX(-20px);
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
    }

    #lightbox.active .lightbox-details {
      opacity: 1;
      transform: translateX(0);
    }

    .lightbox-image-wrap {
      opacity: 0;
      transform: scale(0.98);
      transition: all 1s cubic-bezier(0.2, 0, 0.2, 1) 0.1s;
    }

    #lightbox.active .lightbox-image-wrap {
      opacity: 1;
      transform: scale(1);
    }

    .lightbox-details h2 {
      font-family: var(--serif);
      font-size: 48px;
      font-weight: 300;
      font-style: italic;
      margin-bottom: 56px;
      color: var(--gold);
      line-height: 1.2;
    }

    .modal-specs {
      display: flex;
      flex-direction: column;
      gap: 40px;
      border-left: 1px solid var(--gold-dim);
      padding-left: 32px;
    }

    .modal-spec-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-spec-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.4em;
      color: var(--mist);
    }

    .modal-spec-val {
      font-family: var(--serif);
      font-size: 20px;
      letter-spacing: 0.05em;
      color: var(--cream);
    }

    .lightbox-image-wrap {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .lightbox-image-wrap img {
      max-width: 100%;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 40px 150px rgba(0, 0, 0, 0.8), 0 0 40px rgba(201, 169, 110, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px;
      background: var(--ink);
    }

    .close-lightbox {
      position: absolute;
      top: 40px;
      right: 40px;
      color: var(--mist);
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.3s;
    }

    .close-lightbox:hover {
      color: var(--gold);
    }

    @media (max-width: 1024px) {
      .lightbox-content {
        grid-template-columns: 1fr;
        height: auto;
        gap: 40px;
      }

      .lightbox-image-wrap {
        order: -1;
        height: 50vh;
      }

      .lightbox-details h2 {
        font-size: 32px;
        margin-bottom: 24px;
      }

      #lightbox {
        padding: 40px 20px;
      }
    }

    .gallery-item:hover .gallery-item-label {
      color: var(--cream);
      transform: translateY(0);
    }

    /* ── Filter Bar ── */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 64px;
      padding: 0 80px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--mist);
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.4s, transform 0.4s;
      position: relative;
      padding-bottom: 8px;
    }

    .filter-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 1px;
      background: var(--gold);
      transition: width 0.4s, left 0.4s;
    }

    .filter-btn:hover {
      color: var(--cream);
    }

    .filter-btn.active {
      color: var(--gold);
    }

    .filter-btn.active::after {
      width: 100%;
      left: 0;
    }

    .gallery-item.hidden {
      display: none;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 56px 80px;
      text-align: center;
    }

    footer .f-logo {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 300;
      color: var(--cream);
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    footer .f-logo em {
      color: var(--gold);
      font-style: normal;
    }

    footer p {
      font-size: 12px;
      color: var(--mist);
      letter-spacing: 0.06em;
    }
  </style>
</head>

<body>

  <div id="cursor"></div>
  <div id="cursor-dot"></div>

  <!-- Nav -->
  <nav id="nav">
    <a href="index.html" class="nav-logo">Subhagsoni <em>Kulthe</em></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html" style="color: var(--gold)">Gallery</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header>
    <h1>Selected <em>Photographs</em></h1>
    <p class="header-desc">A curated collection of moments, shadows, and light from across the world.</p>
  </header>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <!-- Dynamic themes will be injected here -->
  </div>

  <div class="gallery-container" id="gallery-container">
    <!-- Items added via admin.html will appear here automatically -->
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" ondblclick="closeLightbox()">
    <span class="close-lightbox" onclick="closeLightbox()">Close</span>
    <div class="lightbox-content">
      <div class="lightbox-details">
        <p class="modal-spec-label" style="margin-bottom: 12px; color: var(--gold);">Shot Details</p>
        <h2 id="modalTitle">Image Title</h2>

        <div class="modal-specs">
          <div class="modal-spec-item">
            <span class="modal-spec-label">Camera & Lens</span>
            <span class="modal-spec-val" id="modalCamera">-</span>
          </div>
          <div class="modal-spec-item">
            <span class="modal-spec-label">Settings</span>
            <span class="modal-spec-val" id="modalSettings">-</span>
          </div>
          <div class="modal-spec-item">
            <span class="modal-spec-label">Location</span>
            <span class="modal-spec-val" id="modalLocation">-</span>
          </div>
          <div class="modal-spec-item">
            <span class="modal-spec-label">Date</span>
            <span class="modal-spec-val" id="modalDate">-</span>
          </div>
        </div>
      </div>
      <div class="lightbox-image-wrap">
        <img id="modalImg" src="" alt="">
      </div>
    </div>
  </div>

  <footer>
    <div class="f-logo">Subhagsoni <em>Kulthe</em></div>
    <p>© 2024 — All images reserved</p>

  </footer>

  <script>
    // Custom cursor
    const cursor = document.getElementById('cursor');
    const dot = document.getElementById('cursor-dot');
    let mx = -100, my = -100, cx = -100, cy = -100;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; });
    (function animCursor() {
      cx += (mx - cx) * 0.12;
      cy += (my - cy) * 0.12;
      cursor.style.left = cx + 'px';
      cursor.style.top = cy + 'px';
      requestAnimationFrame(animCursor);
    })();

    // Nav scroll
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 20);
    });

    // Load dynamic items from localStorage
    function loadDynamicItems() {
      const container = document.getElementById('gallery-container');
      const items = JSON.parse(localStorage.getItem('galleryItems') || '[]');
      const themes = new Set(['Nature', 'Drama']); // Default themes

      items.forEach(item => {
        if (item.theme) themes.add(item.theme);

        const itemDiv = document.createElement('div');
        itemDiv.className = 'gallery-item';
        itemDiv.setAttribute('data-category', item.theme || 'Uncategorized');
        const specs = item.specs || {};

        // Store metadata in data attributes for the double-click event
        itemDiv.setAttribute('data-title', item.title);
        itemDiv.setAttribute('data-camera', specs.camera || '-');
        itemDiv.setAttribute('data-location', specs.location || '-');
        itemDiv.setAttribute('data-aperture', specs.aperture || '-');
        itemDiv.setAttribute('data-shutter', specs.shutter || '-');
        itemDiv.setAttribute('data-iso', specs.iso || '-');
        itemDiv.setAttribute('data-date', specs.date || '-');
        itemDiv.setAttribute('data-src', item.src);

        itemDiv.ondblclick = () => openLightbox(itemDiv);

        itemDiv.innerHTML = `
          <img src="${item.src}" class="${item.ratio}" alt="${item.title}">
          <div class="gallery-item-overlay">
            <span class="gallery-item-label">${item.title}</span>
          </div>
        `;
        container.appendChild(itemDiv);
      });

      setupFilters(themes);
    }

    function openLightbox(el) {
      const modal = document.getElementById('lightbox');
      document.getElementById('modalTitle').innerText = el.getAttribute('data-title');
      document.getElementById('modalCamera').innerText = el.getAttribute('data-camera');
      document.getElementById('modalLocation').innerText = el.getAttribute('data-location');
      document.getElementById('modalDate').innerText = el.getAttribute('data-date');

      const settings = `${el.getAttribute('data-aperture')} • ${el.getAttribute('data-shutter')} • ISO ${el.getAttribute('data-iso')}`;
      document.getElementById('modalSettings').innerText = settings;

      document.getElementById('modalImg').src = el.getAttribute('data-src');

      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Lock scroll
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox');
      modal.classList.remove('active');
      document.body.style.overflow = 'auto'; // Unlock scroll
    }

    // Close on escape
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    function setupFilters(themes) {
      const filterBar = document.getElementById('filter-bar');
      themes.forEach(theme => {
        if (theme === 'Uncategorized') return;
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.setAttribute('data-filter', theme);
        btn.innerText = theme;
        filterBar.appendChild(btn);
      });

      // Filter logic
      const buttons = document.querySelectorAll('.filter-btn');
      const items = document.querySelectorAll('.gallery-item');

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const filter = btn.getAttribute('data-filter');

          items.forEach(item => {
            const cat = item.getAttribute('data-category') || 'all';
            // Hardcoded placeholders don't have categories, so they show only on 'all'
            const isPlaceholder = item.querySelector('.photo-placeholder');

            if (filter === 'all') {
              item.style.display = 'block';
            } else if (isPlaceholder) {
              item.style.display = 'none';
            } else if (cat === filter) {
              item.style.display = 'block';
            } else {
              item.style.display = 'none';
            }
          });
        });
      });
    }

    loadDynamicItems();
  </script>
  <!-- Anti-Scraping Protection -->
  <script>
    // CSS protection
    const style = document.createElement('style');
    style.innerHTML = `
      body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      img {
        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
        user-drag: none;
        pointer-events: none;
      }
      .gallery-item, .featured-frame { pointer-events: auto; }
    `;
    document.head.appendChild(style);

    // JS protection
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'c', 'u'].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'c'].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key === 'PrintScreen') {
        navigator.clipboard.writeText('');
        alert('Screenshots are disabled on this website.');
      }
    });

    // OS-level Screenshot Protection (Snipping Tool / Cmd+Shift+4)
    function obscureContent() {
      document.body.style.opacity = '0';
      document.body.style.filter = 'blur(50px)';
    }
    function revealContent() {
      document.body.style.opacity = '1';
      document.body.style.filter = 'none';
    }

    window.addEventListener('blur', obscureContent);
    window.addEventListener('focus', revealContent);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) obscureContent();
      else revealContent();
    });
  </script>
</body>

</html>
